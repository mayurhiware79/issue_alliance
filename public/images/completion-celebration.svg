<?xml version="1.0" encoding="UTF-8" standalone="no"?>
<svg xmlns="http://www.w3.org/2000/svg" width="400" height="400" viewBox="0 0 400 400">
  <defs>
    <!-- Gradients -->
    <radialGradient id="main-glow" cx="60%" cy="40%" r="70%">
      <stop offset="0%" style="stop-color:#4F46E5"/>
      <stop offset="100%" style="stop-color:#10B981"/>
    </radialGradient>
    
    <linearGradient id="burst-grad" x1="50%" y1="0%" x2="50%" y2="100%">
      <stop offset="0%" style="stop-color:#FCD34D"/>
      <stop offset="100%" style="stop-color:#F59E0B"/>
    </linearGradient>

    <!-- Animated Checkmark -->
    <path id="check" d="M18 32.5L8 22 5 25l13 13 26-26-3-3z" fill="#10B981"/>
    
    <!-- Filters -->
    <filter id="soft-glow">
      <feGaussianBlur stdDeviation="4" result="glow"/>
      <feMerge>
        <feMergeNode in="glow"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>

  <!-- Animated Background Burst -->
  <g opacity="0.3">
    <path d="M200 50L250 200 200 350 150 200z" fill="url(#burst-grad)">
      <animateTransform attributeName="transform" type="rotate" from="0 200 200" to="360 200 200" dur="20s" repeatCount="indefinite"/>
    </path>
  </g>

  <!-- Main Badge -->
  <g transform="translate(200 200)">
    <!-- Glowing Orb -->
    <circle cx="0" cy="0" r="120" fill="url(#main-glow)" filter="url(#soft-glow)">
      <animate attributeName="r" values="120;135;120" dur="3s" repeatCount="indefinite"/>
    </circle>

    <!-- Animated Checkmark -->
    <g transform="scale(4) translate(-25 -32)">
      <use href="#check">
        <animate attributeName="opacity" from="0" to="1" dur="0.5s" fill="freeze"/>
        <animateTransform attributeName="transform" type="scale" from="0" to="1" dur="0.8s" additive="sum"/>
      </use>
    </g>

    <!-- Floating Particles -->
    <g fill="#FFFFFF" opacity="0.9">
      <circle cx="-80" cy="-80" r="2">
        <animateMotion path="M 0 0 Q 20 -40 40 0" dur="4s" repeatCount="indefinite"/>
      </circle>
      <circle cx="100" cy="-60" r="2">
        <animateMotion path="M 0 0 Q -30 50 -60 0" dur="5s" repeatCount="indefinite"/>
      </circle>
    </g>
  </g>

  <!-- Celebration Text -->
  <g transform="translate(200 100)">
    <text y="0" font-size="34" font-family="Arial" font-weight="bold" fill="#FFFFFF" text-anchor="middle">
      Congratulations!
      <animate attributeName="fill" values="#FCD34D;#FFFFFF;#10B981" dur="3s" repeatCount="indefinite"/>
    </text>
  </g>

  <!-- Status Message -->
  <g transform="translate(200 350)">
    <text y="0" font-size="24" font-family="Arial" fill="#FFFFFF" text-anchor="middle">
      Today's Issue Solved!
      <animate attributeName="opacity" values="0.6;1;0.6" dur="2s" repeatCount="indefinite"/>
    </text>
  </g>

  <!-- Dynamic Border -->
  <circle cx="200" cy="200" r="195" fill="none" stroke="#FFFFFF" stroke-width="2" opacity="0.3">
    <animate attributeName="stroke-dasharray" values="0 1300;1300 0" dur="8s" repeatCount="indefinite"/>
  </circle>
</svg>