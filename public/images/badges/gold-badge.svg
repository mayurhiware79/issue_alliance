<?xml version="1.0" encoding="UTF-8"?>
<svg width="200" height="200" viewBox="0 0 200 200" xmlns="http://www.w3.org/2000/svg">
  <!-- Gradient definitions -->
  <defs>
    <linearGradient id="goldGradient" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#ffd700" />
      <stop offset="50%" stop-color="#e6b800" />
      <stop offset="100%" stop-color="#ffcc00" />
    </linearGradient>
    
    <linearGradient id="innerCircleGradient" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#ffd700" />
      <stop offset="50%" stop-color="#b8860b" />
      <stop offset="100%" stop-color="#daa520" />
    </linearGradient>
    
    <linearGradient id="ribbonGradient" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#daa520" />
      <stop offset="50%" stop-color="#ffd700" />
      <stop offset="100%" stop-color="#daa520" />
    </linearGradient>
    
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="0" stdDeviation="5" flood-color="#333" flood-opacity="0.5" />
    </filter>
    
    <filter id="glow" x="-30%" y="-30%" width="160%" height="160%">
      <feGaussianBlur stdDeviation="5" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>
  
  <!-- Main Badge Circle with shadow -->
  <circle cx="100" cy="100" r="90" fill="url(#goldGradient)" filter="url(#shadow)" />
  
  <!-- Inner circle -->
  <circle cx="100" cy="100" r="75" fill="url(#innerCircleGradient)" />
  
  <!-- Gold metallic effect overlay -->
  <circle cx="100" cy="100" r="75" fill="url(#goldGradient)" fill-opacity="0.3" />
  
  <!-- Shine effect -->
  <ellipse cx="70" cy="70" rx="55" ry="25" fill="white" fill-opacity="0.2" transform="rotate(-20 100 100)" />
  
  <!-- Trophy icon -->
  <g transform="translate(70, 45) scale(0.06)">
