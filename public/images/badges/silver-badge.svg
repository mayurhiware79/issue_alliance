<?xml version="1.0" encoding="UTF-8"?>
<svg width="200" height="200" viewBox="0 0 200 200" xmlns="http://www.w3.org/2000/svg">
  <!-- Gradient definitions -->
  <defs>
    <linearGradient id="silverGradient" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#e0e0e0" />
      <stop offset="50%" stop-color="#a0a0a0" />
      <stop offset="100%" stop-color="#c0c0c0" />
    </linearGradient>
    
    <linearGradient id="innerCircleGradient" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#e0e0e0" />
      <stop offset="50%" stop-color="#909090" />
      <stop offset="100%" stop-color="#c0c0c0" />
    </linearGradient>
    
    <linearGradient id="ribbonGradient" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#707070" />
      <stop offset="50%" stop-color="#c0c0c0" />
      <stop offset="100%" stop-color="#707070" />
    </linearGradient>
    
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="0" stdDeviation="5" flood-color="#333" flood-opacity="0.5" />
    </filter>
    
    <filter id="glow" x="-30%" y="-30%" width="160%" height="160%">
      <feGaussianBlur stdDeviation="5" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>
  
  <!-- Main Badge Circle with shadow -->
  <circle cx="100" cy="100" r="90" fill="url(#silverGradient)" filter="url(#shadow)" />
  
  <!-- Inner circle -->
  <circle cx="100" cy="100" r="75" fill="url(#innerCircleGradient)" />
  
  <!-- Silver metallic effect overlay -->
  <circle cx="100" cy="100" r="75" fill="url(#silverGradient)" fill-opacity="0.3" />
  
  <!-- Shine effect -->
  <ellipse cx="70" cy="70" rx="55" ry="25" fill="white" fill-opacity="0.3" transform="rotate(-20 100 100)" />
  
  <!-- Star icon -->
  <g transform="translate(70, 50) scale(0.3)">
    <path d="M165.9 9.2L193.5 65.8L260.4 76.5C272.1 78.1 277.8 92.4 269.7 101.6L227 150.3L239.4 218.2C241.3 230.4 229.1 239.3 218.5 233.4L160 199.6L101.5 233.4C90.9 239.3 78.7 230.4 80.6 218.2L93 150.3L50.3 101.6C42.2 92.4 47.9 78.1 59.6 76.5L126.5 65.8L154.1 9.2C159.6-2.3 160.4-2.3 165.9 9.2Z" fill="#909090"/>
  </g>
  
  <!-- Small decorative stars -->
  <g class="sparkles">
    <circle cx="65" cy="50" r="3" fill="white">
      <animate attributeName="opacity" values="0.2;1;0.2" dur="2s" repeatCount="indefinite" />
    </circle>
    <circle cx="135" cy="50" r="3" fill="white">
      <animate attributeName="opacity" values="0.5;1;0.5" dur="2.5s" repeatCount="indefinite" />
    </circle>
    <circle cx="50" cy="135" r="2.5" fill="white">
      <animate attributeName="opacity" values="0.4;0.9;0.4" dur="3s" repeatCount="indefinite" />
    </circle>
    <circle cx="150" cy="135" r="2.5" fill="white">
      <animate attributeName="opacity" values="0.3;0.8;0.3" dur="2.7s" repeatCount="indefinite" />
    </circle>
  </g>
  
  <!-- "SILVER" text -->
  <text x="100" y="115" font-family="Arial, sans-serif" font-size="20" font-weight="bold" fill="#505050" 
        text-anchor="middle" filter="url(#glow)">SILVER</text>
  
  <!-- Ribbon banner at bottom -->
  <path d="M50 140 L150 140 L140 160 L60 160 Z" fill="url(#ribbonGradient)" />
  
  <!-- "INTERMEDIATE" text in ribbon -->
  <text x="100" y="155" font-family="Arial, sans-serif" font-size="14" font-weight="bold" fill="#505050" 
        text-anchor="middle">INTERMEDIATE</text>
</svg> 