<?xml version="1.0" encoding="UTF-8" standalone="no"?>
<svg xmlns="http://www.w3.org/2000/svg" width="200" height="200" viewBox="0 0 200 200">
  <defs>
    <linearGradient id="face-grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#10B981;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#3B82F6;stop-opacity:1" />
    </linearGradient>
    <linearGradient id="edge-grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#065F46;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#1E40AF;stop-opacity:1" />
    </linearGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="4" stdDeviation="4" flood-color="#0008" />
    </filter>
    <filter id="bevel" x="-10%" y="-10%" width="120%" height="120%">
      <feSpecularLighting result="specOut" specularExponent="20" lighting-color="#ffffff">
        <fePointLight x="100" y="60" z="100" />
      </feSpecularLighting>
      <feComposite in="SourceGraphic" in2="specOut" operator="arithmetic" k1="0" k2="1" k3="1" k4="0" />
    </filter>
  </defs>
  
  <!-- 3D effect base cylinder -->
  <ellipse cx="100" cy="110" rx="90" ry="15" fill="url(#edge-grad)" opacity="0.6" filter="url(#shadow)" />
  
  <!-- 3D effect side cylinder -->
  <path d="M10,100 A90,90 0 0,1 190,100 L190,110 A90,15 0 0,1 10,110 Z" fill="url(#edge-grad)" />
  
  <!-- Badge face -->
  <circle cx="100" cy="100" r="90" fill="url(#face-grad)" filter="url(#bevel)" />
  
  <!-- Inner circle -->
  <circle cx="100" cy="100" r="75" fill="#fff" opacity="0.15" />
  
  <!-- 3D Number 2 with shadow -->
  <text x="100" y="75" text-anchor="middle" fill="#065F46" font-family="Arial, sans-serif" font-size="90" font-weight="bold" opacity="0.7" transform="translate(4,4)">2</text>
  <text x="100" y="115" text-anchor="middle" fill="white" font-family="Arial, sans-serif" font-size="90" font-weight="bold">2</text>
  
  <!-- Sparkles -->
  <g fill="white" opacity="0.8">
    <circle cx="55" cy="60" r="3" />
    <circle cx="145" cy="60" r="3" />
    <circle cx="65" cy="140" r="2" />
    <circle cx="135" cy="140" r="2" />
    <path d="M170,90 L175,95 L170,100 L175,105 L170,110" stroke="white" stroke-width="2" fill="none" />
    <path d="M30,90 L25,95 L30,100 L25,105 L30,110" stroke="white" stroke-width="2" fill="none" />
  </g>
  
  <!-- Badge text with 3D effect -->
  <text x="100" y="172" text-anchor="middle" fill="#065F46" font-family="Arial, sans-serif" font-size="18" font-weight="bold" opacity="0.7" transform="translate(2,2)">DAY 2 COMPLETE</text>
  <text x="100" y="170" text-anchor="middle" fill="white" font-family="Arial, sans-serif" font-size="18" font-weight="bold">DAY 2 COMPLETE</text>
</svg>