<svg xmlns="http://www.w3.org/2000/svg" width="220" height="220" viewBox="0 0 220 220">
  <!-- Gradient definitions -->
  <defs>
    <linearGradient id="bgGradient" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#6366f1" />
      <stop offset="100%" stop-color="#4f46e5" />
    </linearGradient>
    <linearGradient id="innerCircleGradient" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#818cf8" />
      <stop offset="100%" stop-color="#6366f1" />
    </linearGradient>
    <linearGradient id="medalGradient" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#fcd34d" />
      <stop offset="100%" stop-color="#f59e0b" />
    </linearGradient>
    <!-- Filter for shadow effect -->
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="4" stdDeviation="6" flood-color="#000" flood-opacity="0.3" />
    </filter>
    <!-- Filter for glow effect -->
    <filter id="glow" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur stdDeviation="4" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>
  
  <!-- Badge Circle Background -->
  <circle cx="110" cy="110" r="105" fill="url(#bgGradient)" filter="url(#shadow)" />
  
  <!-- Inner circle -->
  <circle cx="110" cy="110" r="85" fill="url(#innerCircleGradient)" />
  
  <!-- Outer decorative ring -->
  <circle cx="110" cy="110" r="98" fill="none" stroke="white" stroke-width="2" stroke-dasharray="4 4" opacity="0.7">
    <animateTransform 
      attributeName="transform" 
      type="rotate" 
      from="0 110 110" 
      to="360 110 110" 
      dur="120s" 
      repeatCount="indefinite" />
  </circle>
  
  <!-- Month Label -->
  <text x="110" y="80" text-anchor="middle" font-family="Arial, sans-serif" font-weight="bold" font-size="24" fill="white">MONTH 1</text>
  
  <!-- Medal -->
  <circle cx="110" cy="125" r="30" fill="url(#medalGradient)" stroke="white" stroke-width="2" />
  <text x="110" y="135" text-anchor="middle" font-family="Arial, sans-serif" font-weight="bold" font-size="30" fill="white">1</text>
  
  <!-- Badge Text -->
  <text x="110" y="180" text-anchor="middle" font-family="Arial, sans-serif" font-weight="bold" font-size="18" fill="white">MASTER</text>
  
  <!-- Stars around the badge -->
  <g fill="white" opacity="0.9">
    <!-- 8 stars positioned around the badge -->
    <path d="M110,15 L113,25 L123,25 L115,32 L118,42 L110,36 L102,42 L105,32 L97,25 L107,25 Z" />
    <path d="M193,65 L196,75 L206,75 L198,82 L201,92 L193,86 L185,92 L188,82 L180,75 L190,75 Z" />
    <path d="M193,155 L196,165 L206,165 L198,172 L201,182 L193,176 L185,182 L188,172 L180,165 L190,165 Z" />
    <path d="M110,205 L113,215 L123,215 L115,222 L118,232 L110,226 L102,232 L105,222 L97,215 L107,215 Z" />
    <path d="M27,155 L30,165 L40,165 L32,172 L35,182 L27,176 L19,182 L22,172 L14,165 L24,165 Z" />
    <path d="M27,65 L30,75 L40,75 L32,82 L35,92 L27,86 L19,92 L22,82 L14,75 L24,75 Z" />
  </g>
  
  <!-- Animated sparkles -->
  <g>
    <circle cx="75" cy="60" r="2" fill="white">
      <animate attributeName="opacity" values="0;1;0" dur="2s" repeatCount="indefinite" begin="0s" />
    </circle>
    <circle cx="145" cy="60" r="2" fill="white">
      <animate attributeName="opacity" values="0;1;0" dur="2s" repeatCount="indefinite" begin="0.3s" />
    </circle>
    <circle cx="60" cy="110" r="2" fill="white">
      <animate attributeName="opacity" values="0;1;0" dur="2s" repeatCount="indefinite" begin="0.6s" />
    </circle>
    <circle cx="160" cy="110" r="2" fill="white">
      <animate attributeName="opacity" values="0;1;0" dur="2s" repeatCount="indefinite" begin="0.9s" />
    </circle>
    <circle cx="75" cy="160" r="2" fill="white">
      <animate attributeName="opacity" values="0;1;0" dur="2s" repeatCount="indefinite" begin="1.2s" />
    </circle>
    <circle cx="145" cy="160" r="2" fill="white">
      <animate attributeName="opacity" values="0;1;0" dur="2s" repeatCount="indefinite" begin="1.5s" />
    </circle>
  </g>
  
  <!-- Ribbon banner -->
  <path d="M70,60 Q110,40 150,60 L150,80 Q110,60 70,80 Z" fill="#c4b5fd" stroke="white" stroke-width="1" opacity="0.8" />
  <text x="110" y="65" text-anchor="middle" font-family="Arial, sans-serif" font-weight="bold" font-size="12" fill="#312e81">ACHIEVEMENT</text>
</svg> 