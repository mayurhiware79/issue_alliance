<svg xmlns="http://www.w3.org/2000/svg" width="220" height="220" viewBox="0 0 220 220">
  <!-- Gradient definitions -->
  <defs>
    <linearGradient id="bgGradient" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#e5e7eb" />
      <stop offset="50%" stop-color="#d1d5db" />
      <stop offset="100%" stop-color="#9ca3af" />
    </linearGradient>
    <linearGradient id="innerCircleGradient" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#f3f4f6" />
      <stop offset="100%" stop-color="#d1d5db" />
    </linearGradient>
    <linearGradient id="crownGradient" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#c084fc" />
      <stop offset="100%" stop-color="#8b5cf6" />
    </linearGradient>
    <!-- Metallic shine effect -->
    <linearGradient id="platinumGradient" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#f9fafb" />
      <stop offset="25%" stop-color="#e5e7eb" />
      <stop offset="50%" stop-color="#d1d5db" />
      <stop offset="75%" stop-color="#f3f4f6" />
      <stop offset="100%" stop-color="#9ca3af" />
    </linearGradient>
    <!-- Filter for shadow effect -->
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="4" stdDeviation="6" flood-color="#000" flood-opacity="0.3" />
    </filter>
    <!-- Filter for glow effect -->
    <filter id="glow" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur stdDeviation="4" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
    <!-- Animated pulsing effect -->
    <radialGradient id="pulseGradient" cx="50%" cy="50%" r="50%" fx="50%" fy="50%">
      <stop offset="0%" stop-color="white" stop-opacity="0.7">
        <animate attributeName="stop-opacity" values="0.7;0.2;0.7" dur="3s" repeatCount="indefinite" />
      </stop>
      <stop offset="100%" stop-color="white" stop-opacity="0">
        <animate attributeName="stop-opacity" values="0;0.2;0" dur="3s" repeatCount="indefinite" />
      </stop>
    </radialGradient>
  </defs>
  
  <!-- Badge Circle Background -->
  <circle cx="110" cy="110" r="105" fill="url(#bgGradient)" filter="url(#shadow)" />
  
  <!-- Pulse effect ring -->
  <circle cx="110" cy="110" r="95" fill="none" stroke="url(#pulseGradient)" stroke-width="5" />
  
  <!-- Inner circle with platinum finish -->
  <circle cx="110" cy="110" r="85" fill="url(#platinumGradient)" />
  
  <!-- Decorative elements -->
  <circle cx="110" cy="110" r="75" fill="none" stroke="#f9fafb" stroke-width="2" stroke-dasharray="4 2" />
  <circle cx="110" cy="110" r="65" fill="none" stroke="#f9fafb" stroke-width="1" />
  
  <!-- Diamond shape in center -->
  <path d="M110,60 L135,110 L110,160 L85,110 Z" fill="url(#innerCircleGradient)" stroke="#f9fafb" stroke-width="2" />
  
  <!-- Platinum text -->
  <text x="110" y="75" text-anchor="middle" font-family="Arial, sans-serif" font-weight="bold" font-size="24" fill="#4b5563">PLATINUM</text>
  
  <!-- Crown on top -->
  <path d="M85,60 L95,40 L110,55 L125,40 L135,60 Z" fill="url(#crownGradient)" stroke="#f9fafb" stroke-width="1" />
  <circle cx="95" cy="45" r="3" fill="#f9fafb" />
  <circle cx="110" cy="50" r="3" fill="#f9fafb" />
  <circle cx="125" cy="45" r="3" fill="#f9fafb" />
  
  <!-- Elite badge text -->
  <text x="110" y="180" text-anchor="middle" font-family="Arial, sans-serif" font-weight="bold" font-size="18" fill="#4b5563">ELITE BADGE</text>
  
  <!-- Animated sparkles -->
  <g>
    <circle cx="75" cy="90" r="2" fill="white">
      <animate attributeName="opacity" values="0;1;0" dur="2s" repeatCount="indefinite" begin="0s" />
    </circle>
    <circle cx="145" cy="90" r="2" fill="white">
      <animate attributeName="opacity" values="0;1;0" dur="2s" repeatCount="indefinite" begin="0.3s" />
    </circle>
    <circle cx="75" cy="130" r="2" fill="white">
      <animate attributeName="opacity" values="0;1;0" dur="2s" repeatCount="indefinite" begin="0.6s" />
    </circle>
    <circle cx="145" cy="130" r="2" fill="white">
      <animate attributeName="opacity" values="0;1;0" dur="2s" repeatCount="indefinite" begin="0.9s" />
    </circle>
  </g>
  
  <!-- Star bursts around edge -->
  <g fill="#f9fafb" opacity="0.8">
    <path d="M110,15 L113,25 L123,25 L115,32 L118,42 L110,36 L102,42 L105,32 L97,25 L107,25 Z" />
    <path d="M193,65 L196,75 L206,75 L198,82 L201,92 L193,86 L185,92 L188,82 L180,75 L190,75 Z" />
    <path d="M193,155 L196,165 L206,165 L198,172 L201,182 L193,176 L185,182 L188,172 L180,165 L190,165 Z" />
    <path d="M110,205 L113,215 L123,215 L115,222 L118,232 L110,226 L102,232 L105,222 L97,215 L107,215 Z" />
    <path d="M27,155 L30,165 L40,165 L32,172 L35,182 L27,176 L19,182 L22,172 L14,165 L24,165 Z" />
    <path d="M27,65 L30,75 L40,75 L32,82 L35,92 L27,86 L19,92 L22,82 L14,75 L24,75 Z" />
  </g>
  
  <!-- Achievement level -->
  <path d="M65,110 Q110,90 155,110 L155,130 Q110,110 65,130 Z" fill="#8b5cf6" stroke="#f9fafb" stroke-width="1" opacity="0.8" />
  <text x="110" y="120" text-anchor="middle" font-family="Arial, sans-serif" font-weight="bold" font-size="14" fill="#f9fafb">ACHIEVEMENT UNLOCKED</text>
</svg> 