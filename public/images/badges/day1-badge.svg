<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 400">
  <defs>
    <!-- Simplified Gradients -->
    <radialGradient id="main-grad" cx="50%" cy="50%" r="70%">
      <stop offset="0%" style="stop-color:#FFD700;stop-opacity:1"/>
      <stop offset="100%" style="stop-color:#FF6B6B;stop-opacity:1"/>
    </radialGradient>
    
    <linearGradient id="ribbon-grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#4287f5;stop-opacity:1"/>
      <stop offset="100%" style="stop-color:#2E4BFF;stop-opacity:1"/>
    </linearGradient>
    
    <!-- Basic Glow -->
    <filter id="basic-glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="5" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>
  
  <!-- Background -->
  <rect width="400" height="400" fill="#16213E"/>
  
  <!-- Outer Rings -->
  <circle cx="200" cy="200" r="150" fill="none" stroke="#FFD700" stroke-width="4" opacity="0.7">
    <animate attributeName="r" values="150;160;150" dur="3s" repeatCount="indefinite"/>
    <animate attributeName="opacity" values="0.7;0.4;0.7" dur="3s" repeatCount="indefinite"/>
  </circle>
  
  <!-- Main Medal Body -->
  <circle cx="200" cy="200" r="120" fill="url(#main-grad)" stroke="#FFD700" stroke-width="5"/>
  
  <!-- Ribbon -->
  <path d="M120,200 L280,200 L300,320 L100,320 Z" fill="url(#ribbon-grad)" stroke="#2E4BFF" stroke-width="2"/>
  
  <!-- Center Text -->
  <g filter="url(#basic-glow)">
    <text x="200" y="180" text-anchor="middle" font-family="Arial" font-weight="bold" font-size="60" fill="#FFFFFF">DAY</text>
    <text x="200" y="260" text-anchor="middle" font-family="Arial" font-weight="bold" font-size="80" fill="#FFFFFF">1</text>
  </g>
  
  <!-- Stars -->
  <g>
    <!-- Four main stars -->
    <path d="M200,100 L205,90 L215,90 L207,84 L210,74 L200,80 L190,74 L193,84 L185,90 L195,90 Z" fill="#FFFFFF">
      <animate attributeName="opacity" values="1;0.5;1" dur="2s" repeatCount="indefinite"/>
    </path>
    
    <path d="M300,200 L305,190 L315,190 L307,184 L310,174 L300,180 L290,174 L293,184 L285,190 L295,190 Z" fill="#FFFFFF">
      <animate attributeName="opacity" values="1;0.5;1" dur="2.3s" repeatCount="indefinite"/>
    </path>
    
    <path d="M200,300 L205,290 L215,290 L207,284 L210,274 L200,280 L190,274 L193,284 L185,290 L195,290 Z" fill="#FFFFFF">
      <animate attributeName="opacity" values="1;0.5;1" dur="2.5s" repeatCount="indefinite"/>
    </path>
    
    <path d="M100,200 L105,190 L115,190 L107,184 L110,174 L100,180 L90,174 L93,184 L85,190 L95,190 Z" fill="#FFFFFF">
      <animate attributeName="opacity" values="1;0.5;1" dur="2.7s" repeatCount="indefinite"/>
    </path>
  </g>
  
  <!-- Confetti Particles -->
  <g>
    <circle cx="100" cy="100" r="5" fill="#FF5252">
      <animateMotion path="M 0 0 Q 50 100 100 50" dur="3s" repeatCount="indefinite"/>
    </circle>
    
    <rect x="300" y="100" width="8" height="8" fill="#4CAF50">
      <animateMotion path="M 0 0 Q -50 100 -100 50" dur="3.5s" repeatCount="indefinite"/>
    </rect>
    
    <circle cx="100" cy="300" r="6" fill="#448AFF">
      <animateMotion path="M 0 0 Q 50 -100 100 0" dur="4s" repeatCount="indefinite"/>
    </circle>
    
    <rect x="300" y="300" width="7" height="7" fill="#FFEB3B">
      <animateMotion path="M 0 0 Q -50 -100 -100 0" dur="3.2s" repeatCount="indefinite"/>
    </rect>
  </g>
  
  <!-- Celebration Text -->
  <g>
    <text x="200" y="370" font-size="30" font-family="Arial" font-weight="bold" text-anchor="middle" fill="#FFFFFF" filter="url(#basic-glow)">
      CHALLENGE COMPLETE!
      <animate attributeName="fill" values="#FFFFFF;#FFD700;#FFFFFF" dur="4s" repeatCount="indefinite"/>
    </text>
  </g>
</svg>