<?xml version="1.0" encoding="UTF-8"?>
<svg width="200" height="200" viewBox="0 0 200 200" xmlns="http://www.w3.org/2000/svg">
  <!-- Gradient definitions -->
  <defs>
    <linearGradient id="bronzeGradient" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#cd7f32" />
      <stop offset="50%" stop-color="#a06022" />
      <stop offset="100%" stop-color="#b87333" />
    </linearGradient>
    
    <linearGradient id="innerCircleGradient" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#cd7f32" />
      <stop offset="50%" stop-color="#804000" />
      <stop offset="100%" stop-color="#b87333" />
    </linearGradient>
    
    <linearGradient id="ribbonGradient" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#8b4513" />
      <stop offset="50%" stop-color="#cd7f32" />
      <stop offset="100%" stop-color="#8b4513" />
    </linearGradient>
    
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="0" stdDeviation="5" flood-color="#333" flood-opacity="0.5" />
    </filter>
    
    <filter id="glow" x="-30%" y="-30%" width="160%" height="160%">
      <feGaussianBlur stdDeviation="5" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>
  
  <!-- Main Badge Circle with shadow -->
  <circle cx="100" cy="100" r="90" fill="url(#bronzeGradient)" filter="url(#shadow)" />
  
  <!-- Inner circle -->
  <circle cx="100" cy="100" r="75" fill="url(#innerCircleGradient)" />
  
  <!-- Bronze metallic effect overlay -->
  <circle cx="100" cy="100" r="75" fill="url(#bronzeGradient)" fill-opacity="0.3" />
  
  <!-- Shine effect -->
  <ellipse cx="70" cy="70" rx="55" ry="25" fill="white" fill-opacity="0.2" transform="rotate(-20 100 100)" />
  
  <!-- Award ribbon icon -->
  <g transform="translate(76, 50) scale(0.24)">
    <path d="M176 0C185.5 0 193.8 5.516 197.4 14.26L205.9 37H384V88C384 101.3 373.3 112 360 112H352V160H360C373.3 160 384 170.7 384 184V232C384 245.3 373.3 256 360 256H352V304H360C373.3 304 384 314.7 384 328V376C384 389.3 373.3 400 360 400H205.9L197.4 422.7C193.8 431.5 185.5 437 176 437H48C38.52 437 30.16 431.5 26.6 422.7L18.09 400H24C37.25 400 48 389.3 48 376V328C48 314.7 37.25 304 24 304H18.09L26.6 277.3C30.16 268.5 38.52 263 48 263H176C185.5 263 193.8 268.5 197.4 277.3L205.9 300H352V256H205.9L197.4 233.3C193.8 224.5 185.5 219 176 219H48C38.52 219 30.16 213.5 26.6 204.7L18.09 176H24C37.25 176 48 165.3 48 152V104C48 90.75 37.25 80 24 80H18.09L26.6 57.26C30.16 48.52 38.52 43 48 43H176C185.5 43 193.8 48.52 197.4 57.26L205.9 80H352V112H205.9L197.4 89.26C193.8 80.52 185.5 75 176 75H48C38.52 75 30.16 69.48 26.6 60.74L24.9 56H24C10.75 56 0 45.25 0 32C0 18.75 10.75 8 24 8H24.9L26.6 12.74C30.16 21.48 38.52 27 48 27H176z" fill="#8b4513"/>
  </g>
  
  <!-- Small decorative stars -->
  <g class="sparkles">
    <circle cx="65" cy="50" r="3" fill="white">
      <animate attributeName="opacity" values="0.2;1;0.2" dur="2s" repeatCount="indefinite" />
    </circle>
    <circle cx="135" cy="50" r="3" fill="white">
      <animate attributeName="opacity" values="0.5;1;0.5" dur="2.5s" repeatCount="indefinite" />
    </circle>
    <circle cx="50" cy="135" r="2.5" fill="white">
      <animate attributeName="opacity" values="0.4;0.9;0.4" dur="3s" repeatCount="indefinite" />
    </circle>
    <circle cx="150" cy="135" r="2.5" fill="white">
      <animate attributeName="opacity" values="0.3;0.8;0.3" dur="2.7s" repeatCount="indefinite" />
    </circle>
  </g>
  
  <!-- "BRONZE" text -->
  <text x="100" y="115" font-family="Arial, sans-serif" font-size="20" font-weight="bold" fill="#5a3813" 
        text-anchor="middle" filter="url(#glow)">BRONZE</text>
  
  <!-- Ribbon banner at bottom -->
  <path d="M50 140 L150 140 L140 160 L60 160 Z" fill="url(#ribbonGradient)" />
  
  <!-- "BEGINNER" text in ribbon -->
  <text x="100" y="155" font-family="Arial, sans-serif" font-size="14" font-weight="bold" fill="#5a3813" 
        text-anchor="middle">BEGINNER</text>
</svg> 